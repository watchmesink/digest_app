<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digest — News Aggregator</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header">
    <div class="header-content">
      <a href="/" class="logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">Digest</span>
      </a>
      <nav class="nav">
        <a href="#" class="nav-link active" data-filter="">all</a>
        <a href="#" class="nav-link" data-filter="hackernews">hackernews</a>
        <a href="#" class="nav-link" data-filter="showhn">show hn</a>
        <a href="#" class="nav-link" data-filter="hype">hype</a>
        <a href="#" class="nav-link" data-filter="producthunt">producthunt</a>
        <a href="#" class="nav-link" data-filter="telegram">telegram</a>
        <a href="#" class="nav-link" data-filter="hn-comments">hn comments</a>
      </nav>
      <button class="settings-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
  </header>
  
  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="modal-close" id="closeModal">×</button>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <h3>Appearance</h3>
          <div class="theme-toggle-row">
            <span class="theme-toggle-label">Dark Mode</span>
            <label class="theme-switch">
              <input type="checkbox" id="themeToggle">
              <span class="theme-slider"></span>
            </label>
          </div>
        </div>
        
        <div class="settings-section" style="margin-top: var(--space-lg);">
          <h3>Telegram Channels</h3>
          <p class="settings-hint">One channel per line (without @)</p>
          <textarea id="telegramChannels" class="channels-input" rows="12" placeholder="channel_name"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelSettings">Cancel</button>
        <button class="btn btn-primary" id="saveSettings">Save & Refresh</button>
      </div>
    </div>
  </div>

  <main class="main">
    <div class="container">
      <div class="meta-bar">
        <span class="item-count"></span>
        <span class="last-updated"></span>
      </div>
      
      <div class="feed-loading">
        <div class="loading-spinner"></div>
        <span>Loading feed...</span>
      </div>
      
      <ol class="feed-list"></ol>
      
      <div class="feed-empty" style="display: none;">
        <p>No items found for this filter.</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Aggregating news from HackerNews, ProductHunt, Telegram, Hype & more</p>
    </div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
